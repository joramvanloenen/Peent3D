name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Peent3D-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: GUI shader smoke test (software WebGL2)
        run: node tests/smoke.cjs
        timeout-minutes: 6
        continue-on-error: true
      - name: Upload GUI smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Peent3D-GUI-Smoke
          path: tests/smoke.png
          if-no-files-found: ignore

