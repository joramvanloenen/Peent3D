name: Publish downloadable Windows preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check source
        run: npm run check
      - name: Test geometry
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Validate GPU shaders, smart masks and numeric controls
        run: node tests/smoke.cjs
        timeout-minutes: 6
      - name: Package Windows installer and portable EXE
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publish GitHub release with direct downloadable EXEs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1-preview
          target_commitish: main
          name: Peent3D v0.2.1 — Windows smart materials preview
          prerelease: true
          body: |
            Peent3D v0.2.1: topology-based convex/concave edge baker, adjustable world-space Edge Distance, dedicated dust/rust/leak/streak/scratch smart masks, neutral dark-grey/orange UI, scrollable inspector, and directly editable numeric values with reset buttons.
            Windows WebGL2 GPU smoke test runs before publishing.
            **Download either the Setup installer or the portable executable under Assets below.**
            Requires Windows 10/11 and a WebGL2-capable GPU.
            Windows SmartScreen may warn because this preview is not code-signed.
          files: |
            release/Peent3D Setup 0.2.1.exe
            release/Peent3D 0.2.1.exe
          fail_on_unmatched_files: true
