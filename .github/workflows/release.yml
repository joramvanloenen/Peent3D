name: Publish downloadable Windows preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check source
        run: npm run check
      - name: Test geometry
        run: npm test
      - name: Build renderer
        run: npm run build
      - name: Validate GPU shaders, smart masks and numeric controls
        run: node tests/smoke.cjs
        timeout-minutes: 6
      - name: Package Windows installer and portable EXE
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publish GitHub release with direct downloadable EXEs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-preview
          target_commitish: main
          name: Peent3D v0.3.0 — Windows smart materials preview
          prerelease: true
          body: |
            Peent3D v0.3.0: rebuilt leaks and gravity streaks as deterministic gravity-projected particle trails emitted only from real upper mesh edges/ledges, traced continuously over triangle adjacency, with meniscus beads, taper, capillary drift and varying run lengths; no arbitrary mid-surface spawn points; corrected edge wear pipeline (soft distance and soft grunge combined before final contrast) with improved mask thumbnails; searchable, categorized smart-mask preset browser with illustrative previews, 21 curated recipes including multi-mask stacks, append/replace workflow and locally saved custom recipes; fully adjustable edge-wear breakup band can now reach the 100% worn core;  new standalone Signed Mean Curvature smart-mask generator with welded cotangent Laplacian, 3 edge-aware smoothing scales, Convex/Concave/Both/Signed modes, cutoff and intensity controls, plus supports multiple editable smart masks per material layer (multiply/add/subtract/max/min/replace), per-mask Angle Threshold and individual mask scale/seed, and true world-space distance to real feature edges for UV-seam-safe edge wear; plus responsive scrubbing, cached GPU shaders, quarter-resolution interactive smart masks, transition-only grunge breakup with adjustable intensity/hardness/band position/width, topology-based convex/concave edge baker, adjustable world-space Edge Distance, dedicated dust/rust/leak/streak/scratch smart masks, neutral dark-grey/orange UI, scrollable inspector, and directly editable numeric values with reset buttons.
            Edge-wear shader regression: first blend soft geometric edge distance with soft grunge, then apply final contrast. Preview cards follow the same order.
            Windows WebGL2 GPU smoke test runs before publishing.
            **Download either the Setup installer or the portable executable under Assets below.**
            Requires Windows 10/11 and a WebGL2-capable GPU.
            Windows SmartScreen may warn because this preview is not code-signed.
          files: |
            release/Peent3D Setup 0.3.0.exe
            release/Peent3D 0.3.0.exe
          fail_on_unmatched_files: true
